<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YDS Deneme Sınavı Pro - Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #37474F;
            --header-bg: #263238;
            --card-bg: #455A64;
            --accent-color: #FBC02D;
            --text-color: #ffffff;
            --subtext-color: #B0BEC5;
            --success-color: #66BB6A;
            --danger-color: #EF5350;
            --admin-bg: #1c262b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #212121;
            color: var(--text-color);
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        .app-container {
            width: 100%;
            max-width: 480px;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            position: relative;
            min-height: 100vh;
        }
        /* --- HEADER --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: var(--header-bg);
            z-index: 10;
        }
        .header-title { font-size: 18px; font-weight: 700; letter-spacing: 1px; }
        .icon-btn { font-size: 20px; color: #90a4ae; cursor: pointer; }

        /* --- MENÜ --- */
        #menu-view { display: flex; flex-direction: column; height: 100%; padding-bottom: 80px; }
        .nav-scroller {
            display: flex; justify-content: center;
            background-color: #455A64; padding: 0 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .nav-item {
            padding: 15px 40px; color: var(--accent-color);
            font-weight: 700; font-size: 15px; text-decoration: none;
            position: relative;
        }
        .nav-item::after {
            content: ''; position: absolute; bottom: 0; left: 0;
            width: 100%; height: 3px; background-color: var(--accent-color);
        }
        .content-list { padding: 20px; overflow-y: auto; flex: 1; }
        .level-card {
            background-color: var(--card-bg);
            border: 1px solid var(--accent-color);
            border-radius: 12px; padding: 15px; margin-bottom: 15px;
            display: flex; justify-content: space-between; align-items: center;
            cursor: pointer; transition: 0.2s;
        }
        .level-card:active { transform: scale(0.98); }
        .card-left { display: flex; align-items: center; gap: 15px; }
        .card-title { font-weight: 700; font-size: 16px; }
        .card-right { text-align: right; }
        .progress-pill { background: #263238; color: #cfd8dc; font-size: 10px; padding: 4px 8px; border-radius: 10px; }
        .score-badge { color: var(--accent-color); font-weight: bold; font-size: 13px; }

        /* --- SINAV EKRANI --- */
        #quiz-view {
            display: none;
            flex-direction: column; height: 100vh;
            background-color: var(--bg-color);
            position: fixed; top: 0; left: 0; width: 100%; z-index: 100;
        }
        .quiz-header { background: var(--header-bg); padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .timer-box { border: 1px solid var(--accent-color); color: var(--accent-color); padding: 5px 12px; border-radius: 20px; font-weight: bold; }
        .quiz-content { flex: 1; padding: 20px; overflow-y: auto; }
        .question-card { background: var(--card-bg); padding: 20px; border-radius: 15px; }
        .options-list { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
        .option-btn {
            background: transparent; border: 1px solid #78909C; color: white;
            padding: 12px; border-radius: 8px; text-align: left; cursor: pointer;
            display: flex; gap: 10px; align-items: center;
        }
        .option-btn.selected { border-color: var(--accent-color); background: rgba(251, 192, 45, 0.1); }
        .option-letter { width: 24px; height: 24px; background: #546E7A; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; }
        .option-btn.selected .option-letter { background: var(--accent-color); color: black; }

        /* --- ADMIN PANEL --- */
        #admin-panel {
            background: var(--admin-bg); padding: 20px; border-top: 3px solid var(--accent-color);
        }
        .admin-input { width: 100%; padding: 10px; margin: 10px 0; background: #37474F; border: 1px solid #546E7A; color: white; border-radius: 5px; }
        .admin-btn { width: 100%; padding: 12px; background: var(--success-color); border: none; color: white; font-weight: bold; cursor: pointer; border-radius: 5px; }
        
        /* MODAL */
        .modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.9); display:none; align-items:center; justify-content:center; z-index:200; }
        .result-card { background: var(--card-bg); padding: 30px; border-radius: 20px; text-align: center; width: 80%; }
        .nav-btn { background: var(--accent-color); border:none; padding: 10px 20px; border-radius: 5px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="app-container">
    <div id="menu-view">
        <header>
            <div class="icon-btn"><i class="fa-solid fa-bars"></i></div>
            <div class="header-title">YDS PRO PANEL</div>
            <div class="icon-btn" onclick="toggleAdmin()"><i class="fa-solid fa-plus-circle"></i></div>
        </header>
        <div class="nav-scroller"><div class="nav-item">DENEMELER</div></div>
        <main class="content-list" id="cardContainer"></main>

        <div id="admin-panel" style="display:none;">
            <h3 style="color:var(--accent-color)">Soru Ekleme Paneli</h3>
            <p style="font-size: 12px; color: #B0BEC5; margin-top: 5px;">Soruları JSON formatında yapıştırın.</p>
            <input type="number" id="target-exam-id" class="admin-input" placeholder="Deneme No (Örn: 1)">
            <textarea id="bulk-json-input" class="admin-input" rows="8" placeholder='[{"text":"Soru?","options":["A","B","C","D","E"],"correct":0}]'></textarea>
            <button class="admin-btn" onclick="importQuestions()">SİSTEME YÜKLE</button>
        </div>
    </div>

    <div id="quiz-view">
        <div class="quiz-header">
            <div class="icon-btn" onclick="exitExam()"><i class="fa-solid fa-xmark"></i></div>
            <div class="timer-box"><i class="fa-regular fa-clock"></i> <span id="timer">180:00</span></div>
            <div id="q-count">1/80</div>
        </div>
        <div class="quiz-content">
            <div class="question-card">
                <div id="question-text" class="question-text">Soru...</div>
                <div id="options-container" class="options-list"></div>
            </div>
        </div>
        <div style="padding: 20px; display: flex; justify-content: space-between; background: var(--header-bg);">
            <button class="nav-btn" id="prev-btn" onclick="prevQuestion()">Geri</button>
            <button class="nav-btn" id="next-btn" onclick="nextQuestion()">İleri</button>
            <button class="nav-btn" id="finish-btn" onclick="finishExam()" style="display:none; background: var(--danger-color); color:white;">Bitir</button>
        </div>
    </div>

    <div class="modal-overlay" id="resultModal">
        <div class="result-card">
            <h2 id="res-title">Sınav Bitti!</h2>
            <h1 id="res-score" style="font-size: 48px; color: var(--accent-color); margin: 20px 0;">0</h1>
            <p id="res-stats" style="margin-bottom: 20px;">0 Doğru | 0 Yanlış</p>
            <button class="admin-btn" onclick="location.reload()">Ana Menü</button>
        </div>
    </div>
</div>

<script>
    /* --- VERİ YÖNETİMİ --- */
    let examsData = JSON.parse(localStorage.getItem('yds_exams_data')) || {};
    let currentExamQuestions = [];
    let currentQuestionIndex = 0;
    let userAnswers = [];
    let activeExamId = null;
    let timerInterval;
    let timeRemaining = 180 * 60;

    /* --- BAŞLATMA --- */
    function initMenu() {
        const container = document.getElementById('cardContainer');
        container.innerHTML = "";
        for (let i = 1; i <= 20; i++) {
            const hasQuestions = examsData[i] ? examsData[i].length : 0;
            const savedScore = localStorage.getItem(`exam_${i}_score`);
            
            container.innerHTML += `
                <div class="level-card" onclick="startExam(${i})">
                    <div class="card-left">
                        <div class="card-title">${i}. Deneme Sınavı</div>
                    </div>
                    <div class="card-right">
                        <div class="progress-pill">${hasQuestions} Soru Mevcut</div>
                        ${savedScore ? `<div class="score-badge">Son: ${savedScore}</div>` : ''}
                    </div>
                </div>
            `;
        }
    }
    initMenu();

    /* --- ADMIN FONKSİYONLARI --- */
    function toggleAdmin() {
        const panel = document.getElementById('admin-panel');
        panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
    }

    function importQuestions() {
        const id = document.getElementById('target-exam-id').value;
        const jsonText = document.getElementById('bulk-json-input').value;
        
        if(!id || !jsonText) return alert("Lütfen tüm alanları doldurun!");

        try {
            const parsed = JSON.parse(jsonText);
            examsData[id] = parsed;
            localStorage.setItem('yds_exams_data', JSON.stringify(examsData));
            alert(`${id}. Denemeye ${parsed.length} soru eklendi.`);
            toggleAdmin();
            initMenu();
        } catch(e) {
            alert("JSON Hatası! Lütfen formatı kontrol edin.");
        }
    }

    /* --- SINAV MOTORU --- */
    function startExam(id) {
        if(!examsData[id] || examsData[id].length === 0) {
            return alert("Bu denemeye henüz soru eklenmemiş! Admin panelinden soru yükleyin.");
        }
        
        activeExamId = id;
        currentExamQuestions = examsData[id];
        userAnswers = new Array(currentExamQuestions.length).fill(null);
        currentQuestionIndex = 0;
        timeRemaining = 180 * 60;

        document.getElementById('menu-view').style.display = 'none';
        document.getElementById('quiz-view').style.display = 'flex';
        
        loadQuestion();
        startTimer();
    }

    function loadQuestion() {
        const q = currentExamQuestions[currentQuestionIndex];
        const letters = ["A", "B", "C", "D", "E"];
        
        document.getElementById('q-count').innerText = `${currentQuestionIndex + 1}/${currentExamQuestions.length}`;
        document.getElementById('question-text').innerText = `${currentQuestionIndex + 1}. ${q.text}`;
        
        const container = document.getElementById('options-container');
        container.innerHTML = "";
        
        q.options.forEach((opt, idx) => {
            const isSelected = userAnswers[currentQuestionIndex] === idx;
            const btn = document.createElement('div');
            btn.className = `option-btn ${isSelected ? 'selected' : ''}`;
            btn.onclick = () => { userAnswers[currentQuestionIndex] = idx; loadQuestion(); };
            btn.innerHTML = `<div class="option-letter">${letters[idx]}</div><div>${opt}</div>`;
            container.appendChild(btn);
        });

        // Buton görünürlükleri
        document.getElementById('prev-btn').style.visibility = currentQuestionIndex === 0 ? 'hidden' : 'visible';
        if(currentQuestionIndex === currentExamQuestions.length - 1) {
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('finish-btn').style.display = 'block';
        } else {
            document.getElementById('next-btn').style.display = 'block';
            document.getElementById('finish-btn').style.display = 'none';
        }
    }

    function nextQuestion() { if(currentQuestionIndex < currentExamQuestions.length -1) { currentQuestionIndex++; loadQuestion(); } }
    function prevQuestion() { if(currentQuestionIndex > 0) { currentQuestionIndex--; loadQuestion(); } }

    function startTimer() {
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeRemaining--;
            let m = Math.floor(timeRemaining / 60);
            let s = timeRemaining % 60;
            document.getElementById('timer').innerText = `${m}:${s < 10 ? '0'+s : s}`;
            if(timeRemaining <= 0) finishExam();
        }, 1000);
    }

    function finishExam() {
        clearInterval(timerInterval);
        let correct = 0;
        currentExamQuestions.forEach((q, i) => {
            if(userAnswers[i] === q.correct) correct++;
        });
        
        const score = ((correct / currentExamQuestions.length) * 100).toFixed(1);
        localStorage.setItem(`exam_${activeExamId}_score`, score);
        
        document.getElementById('res-score').innerText = score;
        document.getElementById('res-stats').innerText = `${correct} Doğru | ${currentExamQuestions.length - correct} Yanlış/Boş`;
        document.getElementById('resultModal').style.display = 'flex';
    }

    function exitExam() {
        if(confirm("Sınavdan çıkmak istiyor musunuz? İlerlemeniz kaydedilmez.")) {
            clearInterval(timerInterval);
            document.getElementById('quiz-view').style.display = 'none';
            document.getElementById('menu-view').style.display = 'flex';
        }
    }
</script>

</body>
</html>
