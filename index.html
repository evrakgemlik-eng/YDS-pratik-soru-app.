<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YDS Soru Bankası Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #37474F; --header-bg: #263238; --card-bg: #455A64;
            --accent-color: #FBC02D; --text-color: #ffffff; --subtext-color: #B0BEC5;
            --success-color: #66BB6A; --danger-color: #EF5350;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Roboto', sans-serif; background-color: var(--bg-color); color: var(--text-color); display: flex; justify-content: center; min-height: 100vh; }
        .app-container { width: 100%; max-width: 480px; background-color: var(--bg-color); position: relative; overflow: hidden; display: flex; flex-direction: column; }

        header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background-color: var(--header-bg); }
        .nav-scroller { display: flex; justify-content: center; background-color: #455A64; padding: 0 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .nav-item { padding: 15px 40px; color: var(--accent-color); font-weight: 700; text-decoration: none; position: relative; }
        .nav-item::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 3px; background-color: var(--accent-color); }

        .content-list { padding: 20px; overflow-y: auto; flex: 1; }
        .level-card { background-color: var(--card-bg); border: 1px solid var(--accent-color); border-radius: 12px; padding: 15px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .score-badge { color: var(--accent-color); font-weight: bold; font-size: 13px; }

        #quiz-view { display: none; flex-direction: column; height: 100vh; background-color: var(--bg-color); position: absolute; top: 0; left: 0; width: 100%; z-index: 20; }
        .quiz-header { background-color: var(--header-bg); padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .timer-box { background: #37474F; border: 1px solid var(--accent-color); color: var(--accent-color); padding: 5px 12px; border-radius: 20px; font-weight: bold; }
        .quiz-content { flex: 1; padding: 20px; overflow-y: auto; }
        .question-card { background-color: var(--card-bg); padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .option-btn { background: transparent; border: 1px solid #78909C; color: #eceff1; padding: 12px 15px; border-radius: 8px; margin-top: 10px; cursor: pointer; display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; transition: 0.2s; }
        .option-btn.selected { background-color: rgba(251, 192, 45, 0.3); border-color: var(--accent-color); }
        .quiz-footer { padding: 15px 20px; background-color: var(--header-bg); display: flex; justify-content: space-between; gap: 10px; }
        .nav-btn { background-color: var(--accent-color); border: none; padding: 12px 25px; border-radius: 8px; font-weight: bold; cursor: pointer; flex: 1; }
        .nav-btn:disabled { background-color: #546E7A; cursor: not-allowed; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 50; }
        .result-card { background: var(--card-bg); width: 85%; padding: 25px; border-radius: 20px; text-align: center; border: 2px solid var(--accent-color); }
    </style>
</head>
<body>

    <div class="app-container">
        <div id="menu-view">
            <header>
                <div class="icon-btn"><i class="fa-solid fa-gear"></i></div>
                <div class="header-title" style="font-weight: 700;">YDS SINAV MERKEZİ</div>
                <div class="icon-btn"><i class="fa-solid fa-user-tie"></i></div>
            </header>
            <nav class="nav-scroller"><a href="#" class="nav-item">DENEMELER</a></nav>
            <main class="content-list" id="cardContainer"></main>
        </div>

        <div id="quiz-view">
            <div class="quiz-header">
                <div onclick="exitExam()" style="cursor:pointer"><i class="fa-solid fa-xmark fa-xl"></i></div>
                <div class="timer-box" id="timer">180:00</div>
                <div><span id="current-q-num">1</span>/<span id="total-q-num">80</span></div>
            </div>
            <div class="quiz-content">
                <div class="question-card">
                    <p id="question-text" style="margin-bottom:20px; font-weight:500; line-height: 1.5;"></p>
                    <div id="options-container"></div>
                </div>
            </div>
            <div class="quiz-footer">
                <button class="nav-btn" id="prev-btn" onclick="prevQuestion()">Geri</button>
                <button class="nav-btn" id="next-action-btn" onclick="nextQuestion()">İleri</button>
            </div>
        </div>

        <div class="modal-overlay" id="resultModal">
            <div class="result-card">
                <h2 style="color:var(--accent-color)">Sınav Tamamlandı</h2>
                <h1 id="final-score" style="font-size:48px; margin:20px 0;">0</h1>
                <p id="stat-text"></p>
                <button class="nav-btn" style="width:100%; margin-top:20px;" onclick="closeResultModal()">Ana Menüye Dön</button>
            </div>
        </div>
    </div>

    <script>
        // --- GERÇEK YDS KELİME SORULARI ---
        const soruBankasi = {
            1: [
                { text: "The government has introduced new ______ to curb the rising inflation rate in the country.", options: ["legislation", "negotiation", "violation", "resignation", "allegation"], correct: 0 },
                { text: "Despite many years of research, the origin of the universe remains a/an ______ to most scientists.", options: ["evidence", "enigma", "consensus", "insight", "climax"], correct: 1 },
                { text: "She was so ______ in her work that she didn't even notice the fire alarm going off.", options: ["vulnerable", "fastidious", "engrossed", "negligible", "notorious"], correct: 2 },
                { text: "The new manager's ______ approach helped to solve the long-standing disputes between the departments.", options: ["vague", "pragmatic", "capricious", "redundant", "hostile"], correct: 1 },
                { text: "The company's profits have ______ significantly since they launched the new advertising campaign.", options: ["plummeted", "stabilized", "burgeoned", "deteriorated", "abated"], correct: 2 }
            ],
            2: [
                { text: "The judge's decision was based on ______ evidence that could not be disputed by the defense.", options: ["tenuous", "tangible", "obscure", "frivolous", "arbitrary"], correct: 1 },
                { text: "In some cultures, it is considered ______ to ask someone about their salary.", options: ["impeccable", "judicious", "indecorous", "benevolent", "eloquent"], correct: 2 },
                { text: "The archeological findings provide ______ evidence of a civilization that existed 5,000 years ago.", options: ["substantial", "meager", "redundant", "vague", "ephemeral"], correct: 0 },
                { text: "The epidemic ______ after the introduction of the new vaccine program.", options: ["exacerbated", "receded", "kindled", "thrived", "erupted"], correct: 1 },
                { text: "His ______ remarks during the meeting caused a lot of tension among his colleagues.", options: ["genial", "disparaging", "meticulous", "plausible", "unanimous"], correct: 1 }
            ]
        };

        const genelHavuz = [
            { text: "The economic crisis has ______ many families of their basic needs.", options: ["deprived", "allocated", "bestowed", "endowed", "exempted"], correct: 0 },
            { text: "Due to ______ weather conditions, all flights have been cancelled until further notice.", options: ["genial", "adverse", "temperate", "serene", "placid"], correct: 1 },
            { text: "The suspect's testimony was ______ with the evidence found at the crime scene.", options: ["inconsistent", "coherent", "impartial", "fastidious", "precise"], correct: 0 },
            { text: "It is ______ that we act immediately to prevent further damage to the environment.", options: ["trivial", "imperative", "negligible", "frivolous", "optional"], correct: 1 }
        ];

        let currentQuestions = [];
        let currentIdx = 0;
        let userAnswers = [];
        let activeExamId = 0;
        let timer;
        let timeLeft;

        function renderMenu() {
            const container = document.getElementById('cardContainer');
            container.innerHTML = "";
            for (let i = 1; i <= 50; i++) {
                const score = localStorage.getItem(`score_${i}`) || "Başlamadın";
                container.innerHTML += `
                    <div class="level-card" onclick="startExam(${i})">
                        <div><b>${i}. Deneme</b><br><small>YDS Kelime & Gramer</small></div>
                        <div class="score-badge">${score === "Başlamadın" ? score : score + " Puan"}</div>
                    </div>`;
            }
        }

        function startExam(id) {
            activeExamId = id;
            currentQuestions = soruBankasi[id] || [...genelHavuz].sort(() => 0.5 - Math.random());
            currentIdx = 0;
            userAnswers = new Array(currentQuestions.length).fill(null);
            
            document.getElementById('total-q-num').innerText = currentQuestions.length;
            document.getElementById('menu-view').style.display = 'none';
            document.getElementById('quiz-view').style.display = 'flex';
            
            loadQuestion();
            startTimer();
        }

        function loadQuestion() {
            const q = currentQuestions[currentIdx];
            document.getElementById('question-text').innerText = q.text;
            document.getElementById('current-q-num').innerText = currentIdx + 1;
            
            const optCont = document.getElementById('options-container');
            optCont.innerHTML = "";
            q.options.forEach((opt, i) => {
                const sel = userAnswers[currentIdx] === i ? 'selected' : '';
                optCont.innerHTML += `<button class="option-btn ${sel}" onclick="setAns(${i})">
                    <b style="color:var(--accent-color)">${String.fromCharCode(65+i)}</b> ${opt}
                </button>`;
            });

            // Geri butonu kontrolü
            document.getElementById('prev-btn').disabled = (currentIdx === 0);

            // İleri / Bitir butonu kontrolü
            const btn = document.getElementById('next-action-btn');
            if(currentIdx === currentQuestions.length - 1) {
                btn.innerText = "Sınavı Bitir";
                btn.style.backgroundColor = "var(--success-color)";
                btn.onclick = finishExam;
            } else {
                btn.innerText = "İleri";
                btn.style.backgroundColor = "var(--accent-color)";
                btn.onclick = nextQuestion;
            }
        }

        function setAns(i) { 
            userAnswers[currentIdx] = i; 
            loadQuestion(); 
        }

        function nextQuestion() { 
            if(currentIdx < currentQuestions.length - 1) { 
                currentIdx++; 
                loadQuestion(); 
            } 
        }

        // HATA DÜZELTİLDİ: prevQuestion fonksiyonu artık loadQuestion çağırarak ekranı güncelliyor.
        function prevQuestion() { 
            if(currentIdx > 0) { 
                currentIdx--; 
                loadQuestion(); 
            } 
        }

        function startTimer() {
            timeLeft = 180 * 60;
            clearInterval(timer);
            timer = setInterval(() => {
                timeLeft--;
                let m = Math.floor(timeLeft / 60);
                let s = timeLeft % 60;
                document.getElementById('timer').innerText = `${m}:${s<10?'0'+s:s}`;
                if(timeLeft <= 0) finishExam();
            }, 1000);
        }

        function finishExam() {
            clearInterval(timer);
            let correct = 0;
            currentQuestions.forEach((q, i) => { if(userAnswers[i] === q.correct) correct++; });
            const score = (correct * (100 / currentQuestions.length)).toFixed(1);
            
            localStorage.setItem(`score_${activeExamId}`, score);
            document.getElementById('final-score').innerText = score;
            document.getElementById('stat-text').innerText = `${currentQuestions.length} soruda ${correct} doğru cevap verdiniz.`;
            document.getElementById('resultModal').style.display = 'flex';
        }

        function exitExam() { 
            if(confirm("Sınavdan çıkmak istediğine emin misin? Mevcut ilerlemen kaydedilmeyecektir.")) {
                clearInterval(timer);
                document.getElementById('quiz-view').style.display = 'none';
                document.getElementById('menu-view').style.display = 'flex';
                renderMenu();
            }
        }

        function closeResultModal() {
            document.getElementById('resultModal').style.display = 'none';
            document.getElementById('quiz-view').style.display = 'none';
            document.getElementById('menu-view').style.display = 'flex';
            renderMenu();
        }

        renderMenu();
    </script>
</body>
</html>
