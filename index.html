<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YDS Soru Bankası</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #37474F; --header-bg: #263238; --card-bg: #455A64;
            --accent-color: #FBC02D; --text-color: #ffffff; --subtext-color: #B0BEC5;
            --success-color: #66BB6A; --danger-color: #EF5350;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Roboto', sans-serif; background-color: var(--bg-color); color: var(--text-color); display: flex; justify-content: center; min-height: 100vh; }
        .app-container { width: 100%; max-width: 480px; background-color: var(--bg-color); position: relative; overflow: hidden; display: flex; flex-direction: column; }

        /* HEADER & NAV */
        header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background-color: var(--header-bg); }
        .nav-scroller { display: flex; justify-content: center; background-color: #455A64; padding: 0 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .nav-item { padding: 15px 40px; color: var(--accent-color); font-weight: 700; text-decoration: none; position: relative; }
        .nav-item::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 3px; background-color: var(--accent-color); }

        /* LIST */
        .content-list { padding: 20px; overflow-y: auto; flex: 1; }
        .level-card { background-color: var(--card-bg); border: 1px solid var(--accent-color); border-radius: 12px; padding: 15px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .score-badge { color: var(--accent-color); font-weight: bold; font-size: 13px; }

        /* QUIZ VIEW */
        #quiz-view { display: none; flex-direction: column; height: 100vh; background-color: var(--bg-color); position: absolute; top: 0; left: 0; width: 100%; z-index: 20; }
        .quiz-header { background-color: var(--header-bg); padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .timer-box { background: #37474F; border: 1px solid var(--accent-color); color: var(--accent-color); padding: 5px 12px; border-radius: 20px; font-weight: bold; }
        .quiz-content { flex: 1; padding: 20px; overflow-y: auto; }
        .question-card { background-color: var(--card-bg); padding: 20px; border-radius: 15px; }
        .option-btn { background: transparent; border: 1px solid #78909C; color: #eceff1; padding: 12px 15px; border-radius: 8px; margin-top: 10px; cursor: pointer; display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; }
        .option-btn.selected { background-color: rgba(251, 192, 45, 0.2); border-color: var(--accent-color); }
        .quiz-footer { padding: 15px 20px; background-color: var(--header-bg); display: flex; justify-content: space-between; }
        .nav-btn { background-color: var(--accent-color); border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }

        /* MODAL */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 50; }
        .result-card { background: var(--card-bg); width: 85%; padding: 25px; border-radius: 20px; text-align: center; border: 2px solid var(--accent-color); }
    </style>
</head>
<body>

    <div class="app-container">
        <div id="menu-view">
            <header>
                <div class="icon-btn"><i class="fa-solid fa-gear"></i></div>
                <div class="header-title">YDS SINAV MERKEZİ</div>
                <div class="icon-btn"><i class="fa-solid fa-user-tie"></i></div>
            </header>
            <nav class="nav-scroller"><a href="#" class="nav-item">DENEMELER</a></nav>
            <main class="content-list" id="cardContainer"></main>
        </div>

        <div id="quiz-view">
            <div class="quiz-header">
                <div onclick="exitExam()"><i class="fa-solid fa-xmark"></i></div>
                <div class="timer-box" id="timer">180:00</div>
                <div><span id="current-q-num">1</span>/80</div>
            </div>
            <div class="quiz-content">
                <div class="question-card">
                    <p id="question-text" style="margin-bottom:20px; font-weight:500;"></p>
                    <div id="options-container"></div>
                </div>
            </div>
            <div class="quiz-footer">
                <button class="nav-btn" onclick="prevQuestion()">Geri</button>
                <button class="nav-btn" id="next-action-btn" onclick="nextQuestion()">İleri</button>
            </div>
        </div>

        <div class="modal-overlay" id="resultModal">
            <div class="result-card">
                <h2 style="color:var(--accent-color)">Sonuç</h2>
                <h1 id="final-score" style="font-size:48px; margin:20px 0;">0</h1>
                <p id="stat-text"></p>
                <button class="nav-btn" style="width:100%; margin-top:20px;" onclick="closeResultModal()">Kapat</button>
            </div>
        </div>
    </div>

    <script>
        // --- SORU BANKASI ---
        // Her deneme numarası için farklı soruları buraya ekleyebilirsin
        const soruBankasi = {
            1: [
                { text: "The team's success was ______ to their hard work.", options: ["due", "because", "since", "as", "result"], correct: 0 },
                { text: "She is ______ intelligent than her sister.", options: ["much", "very", "more", "as", "too"], correct: 2 }
            ],
            2: [
                { text: "Archaeologists ______ a new tomb in Egypt last month.", options: ["covered", "discovered", "invented", "found out", "researched"], correct: 1 },
                { text: "I would go if I ______ you.", options: ["am", "was", "be", "were", "been"], correct: 3 }
            ]
            // 3, 4, 5... diye devam edebilirsin.
        };

        // --- GENEL HAVUZ (Eğer denemeye özel soru yoksa buradan rastgele çekilir) ---
        const genelHavuz = [
            { text: "Choose the synonym of 'Abundant':", options: ["Scarce", "Plentiful", "Rare", "Small", "Empty"], correct: 1 },
            { text: "Despite ______ sick, he went to work.", options: ["be", "being", "been", "was", "is"], correct: 1 },
            { text: "The conference was ______ due to the storm.", options: ["called off", "put on", "taken in", "broken out", "give up"], correct: 0 }
        ];

        let currentQuestions = [];
        let currentIdx = 0;
        let userAnswers = [];
        let activeExamId = 0;
        let timer;
        let timeLeft = 180 * 60;

        // --- MENÜ OLUŞTURMA ---
        function renderMenu() {
            const container = document.getElementById('cardContainer');
            container.innerHTML = "";
            for (let i = 1; i <= 50; i++) {
                const score = localStorage.getItem(`score_${i}`) || "Başlamadın";
                container.innerHTML += `
                    <div class="level-card" onclick="startExam(${i})">
                        <div><b>${i}. Deneme</b><br><small>80 Soru</small></div>
                        <div class="score-badge">${score === "Başlamadın" ? score : score + " Puan"}</div>
                    </div>`;
            }
        }

        // --- SINAV MANTIĞI ---
        function startExam(id) {
            activeExamId = id;
            // O denemeye ait soruları çek, yoksa havuzdan karıştırıp getir
            currentQuestions = soruBankasi[id] || [...genelHavuz].sort(() => 0.5 - Math.random());
            
            currentIdx = 0;
            userAnswers = new Array(currentQuestions.length).fill(null);
            document.getElementById('menu-view').style.display = 'none';
            document.getElementById('quiz-view').style.display = 'flex';
            loadQuestion();
            startTimer();
        }

        function loadQuestion() {
            const q = currentQuestions[currentIdx];
            document.getElementById('question-text').innerText = `${currentIdx + 1}. ${q.text}`;
            document.getElementById('current-q-num').innerText = currentIdx + 1;
            
            const optCont = document.getElementById('options-container');
            optCont.innerHTML = "";
            q.options.forEach((opt, i) => {
                const sel = userAnswers[currentIdx] === i ? 'selected' : '';
                optCont.innerHTML += `<button class="option-btn ${sel}" onclick="setAns(${i})">
                    <b style="color:var(--accent-color)">${String.fromCharCode(65+i)}</b> ${opt}
                </button>`;
            });

            const btn = document.getElementById('next-action-btn');
            if(currentIdx === currentQuestions.length - 1) {
                btn.innerText = "Sınavı Bitir";
                btn.onclick = finishExam;
            } else {
                btn.innerText = "İleri";
                btn.onclick = nextQuestion;
            }
        }

        function setAns(i) { userAnswers[currentIdx] = i; loadQuestion(); }
        function nextQuestion() { if(currentIdx < currentQuestions.length - 1) { currentIdx++; loadQuestion(); } }
        function prevQuestion() { if(currentIdx > 0) { currentIdx--; loadQuestion(); } }

        function startTimer() {
            timeLeft = 180 * 60;
            clearInterval(timer);
            timer = setInterval(() => {
                timeLeft--;
                let m = Math.floor(timeLeft / 60);
                let s = timeLeft % 60;
                document.getElementById('timer').innerText = `${m}:${s<10?'0'+s:s}`;
                if(timeLeft <= 0) finishExam();
            }, 1000);
        }

        function finishExam() {
            clearInterval(timer);
            let correct = 0;
            currentQuestions.forEach((q, i) => { if(userAnswers[i] === q.correct) correct++; });
            const score = (correct * (100 / currentQuestions.length)).toFixed(1);
            
            localStorage.setItem(`score_${activeExamId}`, score);
            document.getElementById('final-score').innerText = score;
            document.getElementById('stat-text').innerText = `${currentQuestions.length} soruda ${correct} doğru cevap.`;
            document.getElementById('resultModal').style.display = 'flex';
        }

        function exitExam() { 
            if(confirm("Sınavdan çıkmak istediğine emin misin?")) {
                clearInterval(timer);
                document.getElementById('quiz-view').style.display = 'none';
                document.getElementById('menu-view').style.display = 'flex';
                renderMenu();
            }
        }

        function closeResultModal() {
            document.getElementById('resultModal').style.display = 'none';
            document.getElementById('quiz-view').style.display = 'none';
            document.getElementById('menu-view').style.display = 'flex';
            renderMenu();
        }

        renderMenu();
    </script>
</body>
</html>
